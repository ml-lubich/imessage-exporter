[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imessage-exporter"
dynamic = ["version"]
description = "A tool to export and search iMessages from local chat.db"
authors = [
  { name="Misha Lubich" },
]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
]
dependencies = [
    "PyYAML>=6.0.1,<7",
    "rich>=13.7,<15",
    "textual>=6.3,<9",
    "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://mishalubich.com"
Repository = "https://github.com/ml-lubich/imessage-exporter"

[dependency-groups]
dev = [
    "pytest>=7.4,<9",
]

[project.scripts]
imessage-exporter = "imessage_exporter.cli:main"
imsg = "imessage_exporter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Config for setuptools_scm
